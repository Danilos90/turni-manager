<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Turni</title>
    <!-- Libreria Chart.js per la Dashboard di Equità -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a2b4c; margin-bottom: 20px; }
        
        /* Barra di Navigazione a Schede (Tab) */
        .nav-tabs { display: flex; gap: 10px; border-bottom: 3px solid #1a2b4c; margin-bottom: 20px; }
        .tab-btn { background: #eef2f5; color: #1a2b4c; border: 1px solid #dcdde1; border-bottom: none; padding: 12px 20px; font-weight: bold; border-radius: 8px 8px 0 0; cursor: pointer; transition: 0.3s; font-size: 15px; }
        .tab-btn:hover { background: #dcdde1; }
        .tab-btn.active { background: #1a2b4c; color: white; border-color: #1a2b4c; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel { background: #eef2f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #dcdde1; }
        .panel h3 { margin-top: 0; color: #1a2b4c; font-size: 18px; border-bottom: 1px solid #ccc; padding-bottom: 5px;}
        
        .controls { display: flex; gap: 15px; align-items: center; background: #1a2b4c; padding: 15px; border-radius: 6px; color: white; flex-wrap: wrap;}
        select, input, button { padding: 8px 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; }
        button { background-color: #f39c12; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #d68910; }
        
        .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px;}
        .checkbox-item { display: flex; align-items: center; gap: 5px; font-weight: bold; background: white; padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc;}
        
        /* Stili per il DB */
        .db-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 15px;}
        .db-list { display: flex; gap: 20px; }
        .db-column { flex: 1; background: white; padding: 10px; border-radius: 4px; border: 1px solid #ccc; min-height: 100px;}
        .db-column h4 { margin: 0 0 10px 0; color: #d35400; text-align: center;}
        .db-item { background: #fdf2e9; padding: 5px 10px; border-radius: 4px; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 14px; border: 1px solid #fad7a1;}
        .btn-remove { background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 12px;}
        .btn-remove:hover { background: #c0392b; }

        .loading { display: none; font-weight: bold; color: #f39c12; margin-top: 10px; text-align: center; font-size: 18px;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 6px; }
        th { background-color: #1a2b4c; color: white; }
        .week-header { background-color: #2c3e50; color: white; text-align: left; padding: 10px; font-weight: bold; font-size: 16px; margin-top: 30px;}
        
        /* Stili per i menu a tendina modifcabili nella griglia */
        select.shift-select {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #ccc;
            text-align: center;
            cursor: pointer;
        }
        .turno-riposo-select { background-color: #e74c3c; color: white; }
        .turno-ferie-select { background-color: #f1c40f; color: black; }
        .turno-lavoro-select { background-color: #ffffff; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Piattaforma Gestione Turni</h1>

    <!-- BARRA DI NAVIGAZIONE A SCHEDE -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="btn-tab-griglia" onclick="switchTab('griglia')">📅 Griglia Turni</button>
        <button class="tab-btn" id="btn-tab-db" onclick="switchTab('db')">⚙️ Gestione DB & Ferie</button>
        <button class="tab-btn" id="btn-tab-analytics" onclick="switchTab('analytics')">📊 Analisi Equità</button>
    </div>

    <!-- ========================================================= -->
    <!-- PAGINA 1: GENERAZIONE E GRIGLIA TURNI -->
    <!-- ========================================================= -->
    <div id="tab-griglia" class="tab-content active">
        <div class="panel">
            <h3>Generazione Griglia</h3>
            <div class="controls">
                <div>
                    <label>Anno: </label>
                    <input type="number" id="year" value="2026" min="2024" max="2030" onchange="cambioAnnoMese()">
                </div>
                <div>
                    <label>Mese: </label>
                    <select id="month" onchange="generateWeekCheckboxes()">
                        <option value="1">Gennaio</option>
                        <option value="2">Febbraio</option>
                        <option value="3">Marzo</option>
                        <option value="4">Aprile</option>
                        <option value="5">Maggio</option>
                        <option value="6">Giugno</option>
                        <option value="7">Luglio</option>
                        <option value="8" selected>Agosto</option>
                        <option value="9">Settembre</option>
                        <option value="10">Ottobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Dicembre</option>
                    </select>
                </div>
                <button onclick="calcolaTurni()" style="background-color: #27ae60;">CALCOLA TURNI ORA</button>
                <button onclick="salvaGriglia()" id="btn-salva" style="background-color: #c0392b; display: none;">💾 SALVA GRIGLIA DEFINITIVA</button>
                <button onclick="caricaGrigliaSalvata()" style="background-color: #2980b9;">📂 VEDI TURNI SALVATI</button>
            </div>

            <div class="checkbox-group" id="checkbox-group"></div>
        </div>

        <div id="loading" class="loading">Elaborazione in corso (Attendi)... ⏳</div>
        <div id="results"></div>
    </div>

    <!-- ========================================================= -->
    <!-- PAGINA 2: GESTIONE DATABASE (FERIE, WEEKEND E RICHIESTE) -->
    <!-- ========================================================= -->
    <div id="tab-db" class="tab-content">
        <div class="panel">
            <h3>Gestione Database (Ferie e Riposi Weekend)</h3>
            <div class="db-form">
                <select id="db-tipo">
                    <option value="weekend">Riposo Weekend (Sab-Dom)</option>
                    <option value="ferie">Ferie Intera Settimana</option>
                </select>
                <select id="db-dipendente"></select>
                <input type="number" id="db-week" placeholder="Num. Settimana (es. 34)" min="1" max="52" style="width: 180px;">
                <button type="button" onclick="aggiungiAlDB()">Aggiungi Regola</button>
            </div>

            <div class="db-list">
                <div class="db-column">
                    <h4>Riposi Weekend (Sab-Dom)</h4>
                    <div id="lista-weekend">Caricamento in corso...</div>
                </div>
                <div class="db-column">
                    <h4>Ferie</h4>
                    <div id="lista-ferie">Caricamento in corso...</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>Richieste Turni / Riposi Specifici</h3>
            <div class="db-form">
                <input type="date" id="req-date">
                <select id="req-dipendente"></select>
                <select id="req-turno">
                    <option value="Riposo">Giorno di Riposo</option>
                    <option value="Apertura">Apertura (09:30)</option>
                    <option value="Chiusura_Lunga">Chiusura (12:00-21:00)</option>
                    <option value="Chiusura_Corta">Chiusura (15:00-21:00)</option>
                </select>
                <button type="button" onclick="aggiungiRichiesta()">Salva Richiesta</button>
            </div>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- PAGINA 3: ANALISI EQUITÀ -->
    <!-- ========================================================= -->
    <div id="tab-analytics" class="tab-content">
        <div class="panel">
            <h3>Analisi Equità Reale (Ultimi 90 Giorni)</h3>
            <div style="background: white; padding: 15px; border-radius: 6px; border: 1px solid #ccc; height: 380px;">
                <canvas id="equityChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    const dipendenti = {
        1: "Arena Caterina", 2: "De Giacomo Giuseppe", 3: "Lucidi Danilo",
        4: "Marono Alessia", 5: "Panariello Luigi", 6: "Paracuollo Mario",
        7: "Quaranta Antonio", 8: "Scarrone Danilo", 9: "Squeglia Gaetana"
    };

    const SHIFT_OPTIONS = [
        "Riposo",
        "09:30 13:00 14:00 18:30",
        "10:00 13:00 14:00 19:00",
        "10:30 13:00 14:00 19:30",
        "11:00 14:30 15:30 20:00",
        "11:30 14:30 15:30 20:30",
        "12:00 14:30 15:30 21:00",
        "15:00 21:00",
        "Ferie"
    ];

    let db_weekends = {}; 
    let db_ferie = {}; 
    let equityChartInstance = null;

    window.onload = function() {
        const selectDip = document.getElementById('db-dipendente');
        const reqDip = document.getElementById('req-dipendente');
        
        for (let id in dipendenti) {
            let opt = document.createElement('option');
            opt.value = id;
            opt.innerHTML = dipendenti[id];
            selectDip.appendChild(opt);
            
            let optReq = document.createElement('option');
            optReq.value = id;
            optReq.innerHTML = dipendenti[id];
            reqDip.appendChild(optReq);
        }
        cambioAnnoMese();
    };

    // FUNZIONE PER CAMBIARE SCHEDA (TAB)
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        document.getElementById(`tab-${tabName}`).classList.add('active');
        document.getElementById(`btn-tab-${tabName}`).classList.add('active');

        // Se apriamo la scheda Analisi Equità, ricarichiamo il grafico
        if (tabName === 'analytics') {
            loadEquityAnalytics();
        }
    }

    function cambioAnnoMese() {
        generateWeekCheckboxes();
        caricaDatabaseDalServer();
    }

    async function caricaDatabaseDalServer() {
        const year = parseInt(document.getElementById('year').value);
        
        try {
            const resW = await fetch(`/api/weekends?year=${year}`);
            const jsonW = await resW.json();
            db_weekends = {};
            if(jsonW.success) {
                jsonW.data.forEach(item => {
                    if(!db_weekends[item.iso_week]) db_weekends[item.iso_week] = [];
                    db_weekends[item.iso_week].push(item.employee_id);
                });
            }

            const resF = await fetch(`/api/ferie?year=${year}`);
            const jsonF = await resF.json();
            db_ferie = {};
            if(jsonF.success) {
                jsonF.data.forEach(item => {
                    if(!db_ferie[item.iso_week]) db_ferie[item.iso_week] = [];
                    db_ferie[item.iso_week].push(item.employee_id);
                });
            }
            aggiornaVisualizzazioneDB();
        } catch (error) {
            console.error("Errore lettura DB:", error);
        }
    }

    async function aggiungiAlDB() {
        const tipo = document.getElementById('db-tipo').value;
        const empId = parseInt(document.getElementById('db-dipendente').value);
        const week = parseInt(document.getElementById('db-week').value);
        const year = parseInt(document.getElementById('year').value);

        if(!week || week < 1 || week > 52) {
            alert("Inserisci un numero di settimana ISO valido (1-52).");
            return;
        }

        const endpoint = tipo === 'weekend' ? '/api/weekends' : '/api/ferie';
        
        await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ employee_id: empId, year: year, iso_week: week })
        });

        caricaDatabaseDalServer();
    }

    async function aggiungiRichiesta() {
        const dateVal = document.getElementById('req-date').value;
        const empId = parseInt(document.getElementById('req-dipendente').value);
        const turnoVal = document.getElementById('req-turno').value;

        if(!dateVal) {
            alert("Per favore, seleziona una data per la richiesta.");
            return;
        }

        try {
            await fetch('/api/richieste', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    employee_id: empId, 
                    req_date: dateVal, 
                    shift_name: turnoVal 
                })
            });
            alert("Richiesta salvata correttamente!");
        } catch (error) {
            alert("Errore nel salvataggio della richiesta.");
        }
    }

    async function rimuoviDalDB(tipo, week, empId) {
        const year = parseInt(document.getElementById('year').value);
        const endpoint = tipo === 'weekend' ? '/api/weekends' : '/api/ferie';

        await fetch(endpoint, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ employee_id: empId, year: year, iso_week: week })
        });

        caricaDatabaseDalServer();
    }

    function aggiornaVisualizzazioneDB() {
        const renderList = (db, elementId, tipo) => {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            let hasItems = false;

            const sortedWeeks = Object.keys(db).sort((a, b) => parseInt(a) - parseInt(b));

            sortedWeeks.forEach(week => {
                db[week].forEach(empId => {
                    hasItems = true;
                    let div = document.createElement('div');
                    div.className = 'db-item';
                    div.innerHTML = `<span><strong>Sett. ${week}:</strong> ${dipendenti[empId]}</span>
                                     <button class="btn-remove" onclick="rimuoviDalDB('${tipo}', ${week}, ${empId})">X</button>`;
                    container.appendChild(div);
                });
            });
            if(!hasItems) container.innerHTML = 'Nessuna regola inserita per questo anno.';
        };

        renderList(db_weekends, 'lista-weekend', 'weekend');
        renderList(db_ferie, 'lista-ferie', 'ferie');
    }

    function getIsoWeeksInMonth(year, month) {
        let weeks = new Set();
        let date = new Date(year, month - 1, 1);
        while (date.getMonth() === month - 1) {
            let target = new Date(date.valueOf());
            let dayNr = (date.getDay() + 6) % 7;
            target.setDate(target.getDate() - dayNr + 3);
            let firstThursday = target.valueOf();
            target.setMonth(0, 1);
            if (target.getDay() !== 4) {
                target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
            }
            let isoWeek = 1 + Math.ceil((firstThursday - target) / 604800000);
            weeks.add(isoWeek);
            date.setDate(date.getDate() + 1);
        }
        return Array.from(weeks);
    }

    function generateWeekCheckboxes() {
        const year = parseInt(document.getElementById('year').value);
        const month = parseInt(document.getElementById('month').value);
        const weeks = getIsoWeeksInMonth(year, month);
        
        const container = document.getElementById('checkbox-group');
        container.innerHTML = ''; 
        
        weeks.forEach(wk => {
            const div = document.createElement('div');
            div.className = 'checkbox-item';
            div.innerHTML = `<input type="checkbox" name="iso_week" value="${wk}" checked> Settimana ${wk}`;
            container.appendChild(div);
        });
    }

    async function calcolaTurni() {
        const year = parseInt(document.getElementById('year').value);
        const checkboxes = document.querySelectorAll('input[name="iso_week"]:checked');
        const target_weeks = Array.from(checkboxes).map(cb => parseInt(cb.value));
        
        if(target_weeks.length === 0) {
            alert("Seleziona almeno una settimana da generare!");
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('results').innerHTML = '';
        document.getElementById('btn-salva').style.display = 'none';

        try {
            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    year: year,
                    target_weeks: target_weeks
                })
            });

            const result = await response.json();
            document.getElementById('loading').style.display = 'none';

            if (result.status === "success") {
                renderTable(result.data, target_weeks);
                document.getElementById('btn-salva').style.display = 'inline-block';
            } else {
                alert("Errore nel calcolo: " + result.message);
            }
        } catch (error) {
            document.getElementById('loading').style.display = 'none';
            alert("Errore di connessione al server.");
        }
    }

    async function salvaGriglia() {
        const selects = document.querySelectorAll('.shift-select');
        if(selects.length === 0) {
            alert("Nessuna griglia da salvare!");
            return;
        }
        
        if(!confirm("Sei sicuro di voler salvare questi turni? Sovrascriveranno eventuali turni già salvati per queste stesse date.")) return;

        let scheduleToSave = [];
        selects.forEach(sel => {
            scheduleToSave.push({
                date: sel.dataset.date,
                employee_id: parseInt(sel.dataset.emp),
                shift: sel.value
            });
        });

        try {
            const response = await fetch('/api/save_schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ schedule: scheduleToSave })
            });
            const result = await response.json();
            if(result.success) {
                alert("Griglia salvata nel database permanente!");
                document.getElementById('btn-salva').style.display = 'none';
            }
        } catch(e) {
            alert("Errore durante il salvataggio.");
        }
    }

    async function caricaGrigliaSalvata() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('results').innerHTML = '';
        document.getElementById('btn-salva').style.display = 'none';

        try {
            const response = await fetch('/api/get_schedule');
            const result = await response.json();
            document.getElementById('loading').style.display = 'none';

            if (result.success && result.data.length > 0) {
                const tutteLeDate = [...new Set(result.data.map(item => item.date))].sort();
                let target_weeks = new Set();
                tutteLeDate.forEach(dStr => {
                    let dObj = new Date(dStr);
                    let target = new Date(dObj.valueOf());
                    let dayNr = (dObj.getDay() + 6) % 7;
                    target.setDate(target.getDate() - dayNr + 3);
                    let firstThursday = target.valueOf();
                    target.setMonth(0, 1);
                    if (target.getDay() !== 4) target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
                    let isoWeek = 1 + Math.ceil((firstThursday - target) / 604800000);
                    target_weeks.add(isoWeek);
                });
                
                renderTable(result.data, Array.from(target_weeks).sort((a,b)=>a-b));
            } else {
                alert("Nessun turno salvato nel database.");
            }
        } catch (error) {
            document.getElementById('loading').style.display = 'none';
            alert("Errore nel caricamento del database.");
        }
    }

    function aggiornaColoreSelect(selectElem) {
        const val = selectElem.value;
        selectElem.className = "shift-select";
        if (val === "Riposo") {
            selectElem.classList.add("turno-riposo-select");
        } else if (val === "Ferie") {
            selectElem.classList.add("turno-ferie-select");
        } else {
            selectElem.classList.add("turno-lavoro-select");
        }
    }

    function renderTable(data, weeks) {
        const resultsDiv = document.getElementById('results');
        const orari = {};
        
        data.forEach(item => {
            if(!orari[item.employee_id]) orari[item.employee_id] = {};
            orari[item.employee_id][item.date] = item.shift;
        });

        const tutteLeDate = [...new Set(data.map(item => item.date))].sort();

        for (let i = 0; i < tutteLeDate.length; i += 7) {
            const giorniSettimana = tutteLeDate.slice(i, i + 7);
            
            let currentIsoWeek = "Sconosciuta";
            if (giorniSettimana.length > 0) {
                 let firstDateStr = giorniSettimana[0];
                 let dObj = new Date(firstDateStr);
                 let target = new Date(dObj.valueOf());
                 let dayNr = (dObj.getDay() + 6) % 7;
                 target.setDate(target.getDate() - dayNr + 3);
                 let firstThursday = target.valueOf();
                 target.setMonth(0, 1);
                 if (target.getDay() !== 4) target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
                 currentIsoWeek = 1 + Math.ceil((firstThursday - target) / 604800000);
            }

            const weekHeader = document.createElement('div');
            weekHeader.className = 'week-header';
            weekHeader.innerText = `Settimana ISO ${currentIsoWeek}`;
            resultsDiv.appendChild(weekHeader);

            let tableHTML = `<table>
                <thead>
                    <tr>
                        <th style="width: 15%;">Dipendente</th>`;
            
            const nomiGiorni = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];
            giorniSettimana.forEach((dataStr, index) => {
                const dObj = new Date(dataStr);
                const dataFormat = dObj.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
                tableHTML += `<th style="width: 12.1%;">${nomiGiorni[index]}<br><small>${dataFormat}</small></th>`;
            });
            tableHTML += `</tr></thead><tbody>`;

            for (let empId = 1; empId <= 9; empId++) {
                tableHTML += `<tr><td><strong>${dipendenti[empId]}</strong></td>`;
                
                giorniSettimana.forEach(dataStr => {
                    let turno = orari[empId] && orari[empId][dataStr] ? orari[empId][dataStr] : "Riposo";
                    
                    let selectClass = "turno-lavoro-select";
                    if(turno === "Riposo") selectClass = "turno-riposo-select";
                    if(turno === "Ferie") selectClass = "turno-ferie-select";
                    
                    let optionsHTML = '';
                    SHIFT_OPTIONS.forEach(opt => {
                        let selected = (opt === turno) ? 'selected' : '';
                        optionsHTML += `<option value="${opt}" ${selected}>${opt}</option>`;
                    });

                    tableHTML += `<td>
                        <select class="shift-select ${selectClass}" data-emp="${empId}" data-date="${dataStr}" onchange="aggiornaColoreSelect(this)">
                            ${optionsHTML}
                        </select>
                    </td>`;
                });
                tableHTML += `</tr>`;
            }
            tableHTML += `</tbody>mtable>`;
            resultsDiv.innerHTML += tableHTML;
        }
    }

    async function loadEquityAnalytics() {
        try {
            const response = await fetch('/api/analytics/equity');
            const result = await response.json();

            if (!result.success) return;

            const labels = result.data.map(item => item.name);
            const dataChiusure = result.data.map(item => item.chiusure);
            const dataWeekend = result.data.map(item => item.weekend);
            const dataAperture = result.data.map(item => item.aperture);

            const ctx = document.getElementById('equityChart').getContext('2d');

            if (equityChartInstance) {
                equityChartInstance.destroy();
            }

            equityChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Chiusure (21:00)',
                            data: dataChiusure,
                            backgroundColor: 'rgba(231, 76, 60, 0.85)',
                            borderColor: '#c0392b',
                            borderWidth: 1
                        },
                        {
                            label: 'Presenze Weekend (Sab/Dom)',
                            data: dataWeekend,
                            backgroundColor: 'rgba(243, 156, 18, 0.85)',
                            borderColor: '#d68910',
                            borderWidth: 1
                        },
                        {
                            label: 'Aperture (09:30)',

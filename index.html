<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Turni</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a2b4c; border-bottom: 2px solid #f39c12; padding-bottom: 10px; }
        
        .panel { background: #eef2f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #dcdde1; }
        .panel h3 { margin-top: 0; color: #1a2b4c; font-size: 18px; border-bottom: 1px solid #ccc; padding-bottom: 5px;}
        
        .controls { display: flex; gap: 15px; align-items: center; background: #1a2b4c; padding: 15px; border-radius: 6px; color: white; flex-wrap: wrap;}
        select, input, button { padding: 8px 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; }
        button { background-color: #f39c12; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #d68910; }
        
        .checkbox-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px;}
        .checkbox-item { display: flex; align-items: center; gap: 5px; font-weight: bold; background: white; padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc;}
        
        /* Stili per il DB */
        .db-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 15px;}
        .db-list { display: flex; gap: 20px; }
        .db-column { flex: 1; background: white; padding: 10px; border-radius: 4px; border: 1px solid #ccc; min-height: 100px;}
        .db-column h4 { margin: 0 0 10px 0; color: #d35400; text-align: center;}
        .db-item { background: #fdf2e9; padding: 5px 10px; border-radius: 4px; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 14px; border: 1px solid #fad7a1;}
        .btn-remove { background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 12px;}
        .btn-remove:hover { background: #c0392b; }

        .loading { display: none; font-weight: bold; color: #f39c12; margin-top: 10px; text-align: center; font-size: 18px;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        th { background-color: #1a2b4c; color: white; }
        .week-header { background-color: #2c3e50; color: white; text-align: left; padding: 10px; font-weight: bold; font-size: 16px; margin-top: 30px;}
        
        .turno-riposo { background-color: #e74c3c; color: white; font-weight: bold; }
        .turno-ferie { background-color: #f1c40f; color: black; font-weight: bold; }
        .turno-lavoro { background-color: #ecf0f1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Generatore Turni Settimanali</h1>
    
    <div class="panel">
        <h3>Gestione Database (Ferie e Riposi Weekend)</h3>
        <div class="db-form">
            <select id="db-tipo">
                <option value="weekend">Riposo Weekend (Sab-Dom)</option>
                <option value="ferie">Ferie Intera Settimana</option>
            </select>
            <select id="db-dipendente"></select>
            <input type="number" id="db-week" placeholder="Num. Settimana (es. 34)" min="1" max="52" style="width: 180px;">
            <button type="button" onclick="aggiungiAlDB()">Aggiungi Regola</button>
        </div>

        <div class="db-list">
            <div class="db-column">
                <h4>Riposi Weekend (Sab-Dom)</h4>
                <div id="lista-weekend">Caricamento in corso...</div>
            </div>
            <div class="db-column">
                <h4>Ferie</h4>
                <div id="lista-ferie">Caricamento in corso...</div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>Generazione Griglia</h3>
        <div class="controls">
            <div>
                <label>Anno: </label>
                <input type="number" id="year" value="2026" min="2024" max="2030" onchange="cambioAnnoMese()">
            </div>
            <div>
                <label>Mese: </label>
                <select id="month" onchange="generateWeekCheckboxes()">
                    <option value="1">Gennaio</option>
                    <option value="2">Febbraio</option>
                    <option value="3">Marzo</option>
                    <option value="4">Aprile</option>
                    <option value="5">Maggio</option>
                    <option value="6">Giugno</option>
                    <option value="7">Luglio</option>
                    <option value="8" selected>Agosto</option>
                    <option value="9">Settembre</option>
                    <option value="10">Ottobre</option>
                    <option value="11">Novembre</option>
                    <option value="12">Dicembre</option>
                </select>
            </div>
            <button onclick="calcolaTurni()" style="background-color: #27ae60;">CALCOLA TURNI ORA</button>
        </div>

        <div class="checkbox-group" id="checkbox-group"></div>
    </div>

    <div id="loading" class="loading">Elaborazione in corso (Attendi)... ⏳</div>
    <div id="results"></div>
</div>

<script>
    const dipendenti = {
        1: "Arena Caterina", 2: "De Giacomo Giuseppe", 3: "Lucidi Danilo",
        4: "Marono Alessia", 5: "Panariello Luigi", 6: "Paracuollo Mario",
        7: "Quaranta Antonio", 8: "Scarrone Danilo", 9: "Squeglia Gaetana"
    };

    let db_weekends = {}; 
    let db_ferie = {}; 

    window.onload = function() {
        const selectDip = document.getElementById('db-dipendente');
        for (let id in dipendenti) {
            let opt = document.createElement('option');
            opt.value = id;
            opt.innerHTML = dipendenti[id];
            selectDip.appendChild(opt);
        }
        cambioAnnoMese();
    };

    function cambioAnnoMese() {
        generateWeekCheckboxes();
        caricaDatabaseDalServer();
    }

    // --- CONNESSIONE AL DATABASE DEL SERVER ---
    async function caricaDatabaseDalServer() {
        const year = parseInt(document.getElementById('year').value);
        
        try {
            const resW = await fetch(`/api/weekends?year=${year}`);
            const jsonW = await resW.json();
            db_weekends = {};
            if(jsonW.success) {
                jsonW.data.forEach(item => {
                    if(!db_weekends[item.iso_week]) db_weekends[item.iso_week] = [];
                    db_weekends[item.iso_week].push(item.employee_id);
                });
            }

            const resF = await fetch(`/api/ferie?year=${year}`);
            const jsonF = await resF.json();
            db_ferie = {};
            if(jsonF.success) {
                jsonF.data.forEach(item => {
                    if(!db_ferie[item.iso_week]) db_ferie[item.iso_week] = [];
                    db_ferie[item.iso_week].push(item.employee_id);
                });
            }
            aggiornaVisualizzazioneDB();
        } catch (error) {
            console.error("Errore lettura DB:", error);
        }
    }

    async function aggiungiAlDB() {
        const tipo = document.getElementById('db-tipo').value;
        const empId = parseInt(document.getElementById('db-dipendente').value);
        const week = parseInt(document.getElementById('db-week').value);
        const year = parseInt(document.getElementById('year').value);

        if(!week || week < 1 || week > 52) {
            alert("Inserisci un numero di settimana ISO valido (1-52).");
            return;
        }

        const endpoint = tipo === 'weekend' ? '/api/weekends' : '/api/ferie';
        
        await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ employee_id: empId, year: year, iso_week: week })
        });

        caricaDatabaseDalServer(); // Ricarica la memoria a schermo
    }

    async function rimuoviDalDB(tipo, week, empId) {
        const year = parseInt(document.getElementById('year').value);
        const endpoint = tipo === 'weekend' ? '/api/weekends' : '/api/ferie';

        await fetch(endpoint, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ employee_id: empId, year: year, iso_week: week })
        });

        caricaDatabaseDalServer(); // Ricarica la memoria a schermo
    }

    function aggiornaVisualizzazioneDB() {
        const renderList = (db, elementId, tipo) => {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            let hasItems = false;

            // Ordina le settimane per numero
            const sortedWeeks = Object.keys(db).sort((a, b) => parseInt(a) - parseInt(b));

            sortedWeeks.forEach(week => {
                db[week].forEach(empId => {
                    hasItems = true;
                    let div = document.createElement('div');
                    div.className = 'db-item';
                    div.innerHTML = `<span><strong>Sett. ${week}:</strong> ${dipendenti[empId]}</span>
                                     <button class="btn-remove" onclick="rimuoviDalDB('${tipo}', ${week}, ${empId})">X</button>`;
                    container.appendChild(div);
                });
            });
            if(!hasItems) container.innerHTML = 'Nessuna regola inserita per questo anno.';
        };

        renderList(db_weekends, 'lista-weekend', 'weekend');
        renderList(db_ferie, 'lista-ferie', 'ferie');
    }

    // --- CALCOLO TURNI ---
    function getIsoWeeksInMonth(year, month) {
        let weeks = new Set();
        let date = new Date(year, month - 1, 1);
        while (date.getMonth() === month - 1) {
            let target = new Date(date.valueOf());
            let dayNr = (date.getDay() + 6) % 7;
            target.setDate(target.getDate() - dayNr + 3);
            let firstThursday = target.valueOf();
            target.setMonth(0, 1);
            if (target.getDay() !== 4) {
                target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
            }
            let isoWeek = 1 + Math.ceil((firstThursday - target) / 604800000);
            weeks.add(isoWeek);
            date.setDate(date.getDate() + 1);
        }
        return Array.from(weeks);
    }

    function generateWeekCheckboxes() {
        const year = parseInt(document.getElementById('year').value);
        const month = parseInt(document.getElementById('month').value);
        const weeks = getIsoWeeksInMonth(year, month);
        
        const container = document.getElementById('checkbox-group');
        container.innerHTML = ''; 
        
        weeks.forEach(wk => {
            const div = document.createElement('div');
            div.className = 'checkbox-item';
            div.innerHTML = `<input type="checkbox" name="iso_week" value="${wk}" checked> Settimana ${wk}`;
            container.appendChild(div);
        });
    }

    async function calcolaTurni() {
        const year = parseInt(document.getElementById('year').value);
        const checkboxes = document.querySelectorAll('input[name="iso_week"]:checked');
        const target_weeks = Array.from(checkboxes).map(cb => parseInt(cb.value));
        
        if(target_weeks.length === 0) {
            alert("Seleziona almeno una settimana da generare!");
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('results').innerHTML = '';

        try {
            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    year: year,
                    target_weeks: target_weeks
                })
            });

            const result = await response.json();
            document.getElementById('loading').style.display = 'none';

            if (result.status === "success") {
                renderTable(result.data, target_weeks);
            } else {
                alert("Errore nel calcolo: " + result.message);
            }
        } catch (error) {
            document.getElementById('loading').style.display = 'none';
            alert("Errore di connessione al server.");
        }
    }

    function renderTable(data, weeks) {
        const resultsDiv = document.getElementById('results');
        const orari = {};
        
        data.forEach(item => {
            if(!orari[item.employee_id]) orari[item.employee_id] = {};
            orari[item.employee_id][item.date] = item.shift;
        });

        const tutteLeDate = [...new Set(data.map(item => item.date))].sort();

        for (let i = 0; i < tutteLeDate.length; i += 7) {
            const giorniSettimana = tutteLeDate.slice(i, i + 7);
            const isoWeek = weeks[i / 7]; 

            const weekHeader = document.createElement('div');
            weekHeader.className = 'week-header';
            weekHeader.innerText = `Settimana ISO ${isoWeek}`;
            resultsDiv.appendChild(weekHeader);

            let tableHTML = `<table>
                <thead>
                    <tr>
                        <th>Dipendente</th>`;
            
            const nomiGiorni = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];
            giorniSettimana.forEach((dataStr, index) => {
                const dObj = new Date(dataStr);
                const dataFormat = dObj.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
                tableHTML += `<th>${nomiGiorni[index]}<br><small>${dataFormat}</small></th>`;
            });
            tableHTML += `</tr></thead><tbody>`;

            for (let empId = 1; empId <= 9; empId++) {
                tableHTML += `<tr><td><strong>${dipendenti[empId]}</strong></td>`;
                
                giorniSettimana.forEach(dataStr => {
                    let turno = orari[empId] && orari[empId][dataStr] ? orari[empId][dataStr] : "Errore";
                    let cssClass = "turno-lavoro";
                    if(turno === "Riposo") cssClass = "turno-riposo";
                    if(turno === "Ferie") cssClass = "turno-ferie";
                    
                    tableHTML += `<td class="${cssClass}">${turno}</td>`;
                });
                tableHTML += `</tr>`;
            }
            tableHTML += `</tbody></table>`;
            resultsDiv.innerHTML += tableHTML;
        }
    }
</script>

</body>
</html>
